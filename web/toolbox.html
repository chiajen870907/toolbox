<html lang="zh-Hant" data-theme="system">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Toolbox</title>
<style>/* 新增：密集工具介面；沿用米白、黃綠與圓角視覺。 */
:root{color-scheme:light;--bg:#f7f6f1;--surface:#fffef9;--subtle:#eeeee6;--text:#292c24;--muted:#777c6c;--line:#dedfd4;--accent:#e4f89b;--accent-text:#303d13;--danger:#a33e34;--success:#577529;--shadow:0 12px 50px #292c2418;--radius:13px;--gap:12px;--nav-height:66px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);line-height:1.55}button,input,select,textarea{font:inherit}button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8da446;outline-offset:2px}[hidden]{display:none!important}h1,h2,p{margin:0}h1{font-size:19px;line-height:1.4}h2{font-size:15px;line-height:1.5}small{font-size:11px}code,pre{font-family:ui-monospace,SFMono-Regular,monospace}button{min-height:44px}.topbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:8px;min-height:61px}.topbar h1{flex:1;font-weight:650}.icon-button{display:grid;place-items:center;min-width:44px;width:44px;height:44px;padding:0;border:0;border-radius:10px;background:transparent;color:var(--text);font-size:25px;line-height:1}.icon-button:hover{background:var(--subtle)}#add-action{background:var(--accent);color:var(--accent-text);font-size:29px}main{max-width:900px;margin:auto;padding:16px 16px calc(var(--nav-height) + env(safe-area-inset-bottom) + 25px)}nav{position:fixed;inset:auto 0 0;z-index:15;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);padding:6px 12px calc(6px + env(safe-area-inset-bottom))}nav button{border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;min-height:51px;min-width:44px;font-size:10px;border-radius:10px}nav .nav-icon{font-size:23px;line-height:1.2;width:38px;border-radius:7px;font-weight:500}nav button.active{color:var(--text);font-weight:650}nav button.active .nav-icon{background:var(--accent);color:var(--accent-text)}.button{display:inline-flex;justify-content:center;align-items:center;gap:6px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 14px;min-height:44px;line-height:1.5;font-weight:550;text-decoration:none;font-size:13px}.button:hover{border-color:var(--muted)}.button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}.button.danger{color:var(--danger)}.wide{width:100%}.stack{display:flex;flex-direction:column;gap:10px}.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary{font-size:11px;color:var(--muted);margin:10px 0 22px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:17px 0 11px}.section-title h2{font-size:15px}.muted{color:var(--muted);font-size:12px;line-height:1.65}.segmented{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.segmented button{border:0;background:transparent;color:var(--muted);min-width:44px;padding:5px 10px;min-height:44px;font-size:11px}.segmented button.selected{background:var(--accent);color:var(--accent-text)}.empty{padding:24px 15px 15px;display:flex;align-items:center;flex-direction:column;text-align:center;gap:10px}.empty-icon{display:grid;place-items:center;width:52px;height:52px;background:var(--subtle);border-radius:15px;font-size:29px;color:var(--muted);margin-bottom:4px}.empty .muted{max-width:290px}.empty .stack{width:100%;max-width:380px;margin-top:16px}.empty-actions{max-width:380px;margin:6px auto;display:grid;gap:10px}.surface{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin:0 0 14px;display:flex;flex-direction:column;gap:11px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .button{flex:1;white-space:nowrap}.app-list{display:grid;gap:8px}.app-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.app-item{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:flex;align-items:center;min-width:0;padding:6px}.app-open{border:0;background:transparent;color:var(--text);display:flex;align-items:center;text-align:left;gap:11px;flex:1;min-width:0;padding:8px;min-height:77px}.app-symbol{background:var(--accent);color:var(--accent-text);width:40px;height:42px;display:grid;place-items:center;border-radius:11px;flex-shrink:0;font-size:17px;font-weight:650}.app-text{display:flex;flex-direction:column;min-width:0;gap:3px}.app-text strong{font-size:14px}.app-description{color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.app-author{font-size:10px;color:var(--muted)}.favorite{color:#80933f;flex-shrink:0}.app-menu{font-size:16px}.app-grid .app-item{padding:8px;flex-direction:column;align-items:stretch;min-height:167px}.app-grid .app-open{flex-direction:column;align-items:flex-start;padding:5px;gap:8px}.app-grid .app-symbol{width:37px;height:38px}.app-grid .favorite{position:absolute;top:3px;right:3px}.app-grid .app-text{padding-right:0;width:100%}.app-grid .app-menu{align-self:flex-end;height:44px;margin-top:-10px}.app-grid .app-description{-webkit-line-clamp:1}.sticky-search{position:sticky;top:calc(61px + env(safe-area-inset-top));background:var(--bg);z-index:6;padding:0 0 10px}.search-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:44px}.search-box>span{font-size:23px;color:var(--muted)}.search-box input{border:0;background:transparent;padding:11px 0;flex:1;min-width:0;outline:none;font-size:16px}.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0 0;scrollbar-width:none}.chip{min-height:44px;border:1px solid var(--line);border-radius:22px;padding:7px 14px;background:var(--surface);color:var(--muted);white-space:nowrap;font-size:12px}.chip.selected{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}.subscription,.session-row{border-top:1px solid var(--line);padding-top:13px;display:flex;flex-direction:column;gap:7px;overflow-wrap:anywhere}.subscription strong{font-size:13px}.subscription small{word-break:break-all}.session-row{display:grid;grid-template-columns:1fr auto auto;align-items:center}.session-row .muted{grid-row:2}.status{border-radius:9px;background:var(--subtle);padding:10px 12px;font-size:12px;line-height:1.65;overflow-wrap:anywhere}.status.error,[data-kind=error]{color:var(--danger)}.status.success,[data-kind=success]{color:var(--success)}.app-info{display:flex;gap:11px;align-items:center}.app-info h1{flex:1;font-size:18px}.metadata{font-size:11px;color:var(--muted)}.settings-form{display:grid;gap:0}.field{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,43%);gap:8px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}.field-label{font-weight:550;font-size:13px}.field-key{grid-column:1/-1;color:var(--muted);font-size:10px;overflow-wrap:anywhere}.default-value{grid-column:1/-1;color:var(--muted);font-size:10px}.field-desc{grid-column:1/-1}.field:has(textarea),.field:has(.choices){grid-template-columns:1fr}.field input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--text);min-height:44px;font-size:16px}.field>output{overflow-wrap:anywhere}.switch-target{display:flex;align-items:center;justify-content:flex-end;min-height:44px;position:relative;cursor:pointer}.switch-target input{position:absolute;right:0;width:44px;height:44px;margin:0;opacity:0}.switch-track{width:43px;height:26px;border-radius:20px;background:var(--line);padding:3px;pointer-events:none}.switch-track:before{content:'';display:block;background:var(--surface);width:20px;height:20px;border-radius:50%;transition:transform .15s}.switch:checked+.switch-track{background:#839c45}.switch:checked+.switch-track:before{transform:translateX(17px);background:#fff}.switch:focus-visible+.switch-track{outline:3px solid #8da446;outline-offset:3px}.choice{display:flex;align-items:center;gap:10px;min-height:44px;font-size:13px}.choice input{accent-color:#7e9441;width:21px;height:21px;flex-shrink:0}.choices{display:grid;gap:0}.slider-control{display:flex;align-items:center;gap:10px;min-height:44px}.slider-control input{width:100%;min-width:0;accent-color:#7e9441;height:44px}.slider-control output{min-width:28px;text-align:right;font-size:12px}.settings-form>.status{margin:0 0 10px}.settings-form>.button{margin:0 0 14px}#view>.button{margin-bottom:10px}.data-row{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:7px 0;gap:7px}.data-open{min-width:0;flex:1;border:0;background:none;color:var(--text);text-align:left;padding:7px 0;display:flex;flex-direction:column;gap:5px}.data-open code{font-size:12px;overflow-wrap:anywhere}.data-preview{max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-height:36px}.diff-row{display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line);padding:12px 0;overflow-wrap:anywhere}.diff-row code{font-size:12px}.record-photo{width:100%;max-height:360px;object-fit:cover;border-radius:8px}.code{white-space:pre-wrap;overflow-wrap:anywhere;max-height:55vh;overflow:auto;font-size:11px;background:var(--subtle);padding:12px;border-radius:8px}dialog{position:fixed;inset:auto 0 0;margin:0 auto;max-width:620px;width:100%;max-height:88dvh;padding:0 18px calc(22px + env(safe-area-inset-bottom));border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;background:var(--surface);color:var(--text);box-shadow:var(--shadow);overflow-y:auto}dialog::backdrop{background:#0006;backdrop-filter:blur(2px)}.sheet-handle{height:4px;background:var(--line);width:33px;margin:9px auto 0;border-radius:10px}.sheet-header{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);padding:8px 0;z-index:1}.sheet-header h2{font-size:17px}.sheet-action{display:block;text-align:left;width:100%;min-height:55px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);font-size:15px;padding:12px 6px}.sheet-action.danger{color:var(--danger)}#sheet-body{display:flex;flex-direction:column;gap:13px;padding-top:7px}#sheet-body>code{overflow-wrap:anywhere}.preview-row{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}#toast{position:fixed;z-index:50;bottom:calc(var(--nav-height) + env(safe-area-inset-bottom) + 15px);left:50%;transform:translateX(-50%);max-width:calc(100vw - 32px);width:max-content;min-width:90px;padding:11px 17px;border:1px solid var(--line);background:var(--text);color:var(--bg);border-radius:10px;box-shadow:var(--shadow);font-size:12px;text-align:center}#toast[data-kind=error]{background:var(--surface);color:var(--danger);width:calc(100vw - 32px);max-width:550px}#toast[data-kind=success]{color:var(--bg)}.demo-banner{padding:8px 15px;background:var(--accent);color:var(--accent-text);font-size:11px;text-align:center}.readonly{font-size:13px}
@media(min-width:800px){.topbar{padding-left:max(24px,calc((100vw - 900px)/2 + 16px));padding-right:max(24px,calc((100vw - 900px)/2 + 16px))}nav{max-width:900px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:14px 14px 0 0}.app-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.app-grid .app-item{min-height:165px}.quick-actions{max-width:440px}.empty-actions{margin:10px auto}dialog{bottom:20px;border:1px solid var(--line);border-radius:20px;padding-bottom:22px}.surface{padding:18px}.session-row{grid-template-columns:1fr 1fr auto auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.surface .muted{white-space:pre-line}
</style>

<body>
<header class="topbar"><button id="back" class="icon-button" aria-label="返回應用" hidden>‹</button><h1 id="page-title">Toolbox</h1><button id="search-action" class="icon-button" aria-label="搜尋應用">⌕</button><button id="add-action" class="icon-button" aria-label="新增應用">＋</button></header>
<main id="view" aria-live="polite"></main>
<nav aria-label="主要導覽"><button data-tab="home"><span class="nav-icon" aria-hidden="true">⌂</span>首頁</button><button data-tab="apps"><span class="nav-icon" aria-hidden="true">▦</span>應用</button><button data-tab="data"><span class="nav-icon" aria-hidden="true">≡</span>資料</button><button data-tab="settings"><span class="nav-icon" aria-hidden="true">⚙</span>設定</button></nav>
<dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-handle"></div><header class="sheet-header"><h2 id="sheet-title"></h2><button id="sheet-close" class="icon-button" aria-label="關閉彈出視窗">×</button></header><div id="sheet-body"></div></dialog>
<div id="toast" role="status" hidden></div>
<script>/* 新增：工具型介面。所有腳本設定沿用 api/settings；管理功能使用獨立 manage API。 */
const BOOT=__QX_BOOT__;
const $=id=>document.getElementById(id);
const node=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n};
const icons={home:'⌂',apps:'▦',data:'≡',settings:'⚙',search:'⌕',plus:'＋',back:'‹',close:'×',star:'☆',filled:'★',more:'•••'};
let state=BOOT.state,manage={available:false,preferences:{favorites:[],theme:'system',language:'zh-Hant',debug:false},metadata:{},sessions:[]};
let search='',category='全部',listMode=false,activeForm=null,dataRows=[],saveQueue=Promise.resolve(),routeVersion=0;
const pendingForms=new Set();
function button(label,action,cls='button'){const b=node('button',cls,label);b.type='button';b.onclick=()=>run(action,b);return b}
function iconButton(label,glyph,action,cls='icon-button'){const b=button(icons[glyph]||glyph,action,cls);b.setAttribute('aria-label',label);b.title=label;return b}
async function run(fn,b){if(b?.disabled)return;try{if(b)b.disabled=true;await fn()}catch(e){showError(e)}finally{if(b)b.disabled=false}}
function toast(message,kind='success'){const t=$('toast');t.textContent=message;t.dataset.kind=kind;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,kind==='error'?6500:2200)}
function showError(e){toast((e.message||'操作失敗')+'；請修正後重試。','error');if(manage.preferences.debug)console.error(e)}
// 沿用：原有 API 與認證方式，集中處理連線錯誤。
async function api(path,body){let response;try{response=await fetch('/api/'+path,{...(body===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json','X-Panel-Token':BOOT.token},body:JSON.stringify(body)}),signal:typeof AbortSignal!=='undefined'&&AbortSignal.timeout?AbortSignal.timeout(25000):undefined})}catch(_){throw Error('無法連到 QX，請確認 QX、重寫與 MITM 已開啟')}let json;try{json=await response.json()}catch(_){throw Error('QX 回應不是有效 JSON，請更新本機控制台腳本')}if(!json.ok)throw Error(json.message||'操作未完成');return json.data}
async function manager(path,body){if(!manage.available)throw Error('目前儲存層尚未提供這項功能，請查看設定頁的功能限制');return api('manage/'+path,body)}
function setApp(app){state.apps=state.apps.map(a=>a.id===app.id?app:a)}
function metadata(app){return manage.metadata[app.id]||{}}
function appCategory(app){const m=metadata(app);return m.category||app.packageName||'未分類'}
function favorites(){return manage.preferences.favorites.filter(id=>state.apps.some(a=>a.id===id))}
function availableApps(){return state.apps.filter(a=>!a.disabled&&!metadata(a).disabled)}
async function savePreference(changes){const next=await manager('preferences',changes);manage.preferences=next;applyTheme()}
function applyTheme(){document.documentElement.dataset.theme=manage.preferences.theme||'system'}
function route(){const raw=location.hash.replace(/^#\/?/,'');const [name='home',encoded='']=raw.split('/');let id='';try{id=decodeURIComponent(encoded)}catch(_){}return {name:({tools:'apps',about:'settings'})[name]||name||'home',id}}
async function navigate(path){try{await flushAll();location.hash='#/'+path}catch(e){showError(e)}}
function contentHeading(title,sub){const row=node('div','section-title');row.append(node('h2','',title));if(sub)row.append(node('span','muted',sub));return row}
function card(title,description){const c=node('section','surface');if(title)c.append(node('h2','',title));if(description)c.append(node('p','muted',description));return c}
function status(text,kind='info'){const p=node('p','status '+kind,text);p.setAttribute('role',kind==='error'?'alert':'status');return p}
function info(title,message){const d=openSheet(title);d.append(node('p','muted',message))}
function openSheet(title){const dialog=$('sheet');if(dialog.open)dialog.close();$('sheet-title').textContent=title;$('sheet-body').replaceChildren();dialog.showModal();return $('sheet-body')}
function closeSheet(){$('sheet').close()}
function textViewer(title,value){const d=openSheet(title),pre=node('pre','code',typeof value==='string'?value:JSON.stringify(value,null,2));d.append(pre,button('複製內容',()=>copy(pre.textContent),'button primary wide'))}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('已複製')}catch(_){const d=openSheet('複製內容'),t=node('textarea');t.value=text;t.readOnly=true;d.append(status('長按內容並選擇「複製」。'),t);t.focus();t.select()}}
function download(value,name){const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const a=node('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function chooseFile(handler){const i=node('input');i.type='file';i.accept='.toolbox.json,.json,application/json';i.hidden=true;document.body.append(i);i.onchange=async()=>{try{const f=i.files[0];if(!f)return;if(f.size>524288)throw Error('檔案超過 512 KB，請拆分後匯入');await handler(JSON.parse(await f.text()))}catch(e){showError(e instanceof SyntaxError?Error('JSON 格式不正確，請檢查檔案內容'):e)}finally{i.remove()}};i.click()}
async function importApps(input){await flushAll();const preview=await api('modules/preview',input);const d=openSheet('匯入預覽');d.append(status('匯入後保留已有設定。'));for(const a of preview)d.append(node('p','preview-row',previewAppLabel(a)+' · '+(a.replacing?'更新':'新增')));d.append(button('確認匯入',async()=>{state=await api('modules/import',input);if(manage.available)await api('manage/metadata',{input});await reloadManage();closeSheet();await navigate(preview.length===1?'app/'+encodeURIComponent(preview[0].id):'apps');render();toast('已匯入')},'button primary wide'))}
function empty(title,description,actions=true){const c=node('section','empty');c.append(node('div','empty-icon','▦'),node('h2','',title),node('p','muted',description));if(actions){const row=node('div','stack');row.append(button('匯入模組 JSON',()=>chooseFile(importApps),'button primary wide'));c.append(row)}return c}
function viewToggle(){const c=node('div','segmented');for(const [mode,label] of [[false,'卡片'],[true,'列表']]){const b=button(label,()=>{listMode=mode;render()},mode===listMode?'selected':'');b.setAttribute('aria-pressed',String(mode===listMode));c.append(b)}return c}

function appResources(app) {
  const resources = node('div','actions');
  const link = (label, href) => {
    const element = node('a','button',label);
    element.href = href;
    resources.append(element);
  };
  for (const page of app.pages || []) {
    link(page.name, '/app/' + encodeURIComponent(app.id) + '/' + encodeURIComponent(page.id));
  }
  if (!app.local?.rewrite && !app.local?.taskConfig) return resources;
  const guide = card('Quantumult X 設定');
  if (BOOT.platform !== 'qx') {
    guide.append(node('p','muted','這個模組的登入與任務使用 Quantumult X 配置。'));
    resources.append(guide);
    return resources;
  }
  guide.append(node('p','muted','在 QX 編輯使用中的設定檔，將下列內容加入既有區段。'));
  const steps = node('ol');
  function step(instruction, value) {
    const item = node('li');
    item.append(node('p','',instruction), node('pre','code',value), button('複製',()=>copy(value)));
    steps.append(item);
  }
  if (app.local.rewrite) {
    const lines = app.local.rewrite.split('\n');
    const rule = lines.find(line => line.startsWith('^'));
    const host = lines.find(line => line.startsWith('hostname')).split('=')[1].trim();
    step('在 [rewrite_local] 加入下方規則。若已有同一條登入規則，更新腳本路徑即可。', rule);
    step('把這個主機名稱合併到 [mitm] 的 hostname 清單，並確認 QX 的 MITM 已開啟。', host);
  }
  if (app.local.taskConfig) {
    step('在 [task_local] 加入下方排程，再到 QX 的任務列表確認是否啟用。', app.local.taskConfig);
  }
  guide.append(steps);
  resources.append(guide);
  return resources;
}
function previewAppLabel(app) {

  if (app.cookie) capabilities.push('登入 Rewrite');
  if (app.task) capabilities.push('Task');
  return app.name+' · '+app.fields+' 個欄位'+(capabilities.length ? ' · '+capabilities.join('、') : '');

$('sheet-close').onclick=closeSheet;$('sheet').addEventListener('click',e=>{if(e.target===$('sheet')){const rect=$('sheet').getBoundingClientRect();if(e.clientY<rect.top||e.clientY>rect.bottom||e.clientX<rect.left||e.clientX>rect.right)closeSheet()}});$('add-action').onclick=()=>chooseFile(importApps);$('back').onclick=()=>navigate(route().name==='records'?'app/'+encodeURIComponent(route().id):'apps');$('search-action').onclick=async()=>{await navigate('apps');setTimeout(()=>$('view').querySelector('input[type=search]')?.focus(),100)};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>navigate(b.dataset.tab));window.addEventListener('hashchange',()=>{run(async()=>{await flushAll();render()})});window.addEventListener('beforeunload',e=>{if(pendingForms.size){e.preventDefault();e.returnValue=''}});document.addEventListener('visibilitychange',()=>{if(document.hidden)run(flushAll)});render();reloadManage().then(render);
</script>
